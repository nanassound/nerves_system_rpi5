name: Build System

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  OTP_VERSION: "28.0.1"
  ELIXIR_VERSION: "1.19.3-otp-28"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Buildroot dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential automake autoconf git squashfs-tools \
            pkg-config curl wget file cpio unzip rsync bc cmake \
            libssl-dev libncurses5-dev \
            python3 python3-aiohttp python3-flake8 python3-ijson \
            python3-nose2 python3-pexpect python3-pytest

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Install Nerves Bootstrap
        run: mix archive.install hex nerves_bootstrap 1.15.0 --force

      - name: Get dependencies
        run: mix deps.get

      - name: Build system
        run: mix compile
        timeout-minutes: 120

      - name: Create artifact
        run: mix nerves.artifact

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nerves-system-artifact
          path: .nerves/artifacts/**/*.tar.gz

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: .nerves/artifacts/**/*.tar.gz
